name: kharag_sdk
description: A production-ready Flutter SDK providing splash screen, onboarding, authentication, subscriptions, and analytics features with clean architecture.
version: 1.0.0
homepage: https://github.com/CodingWithTashi/TibetanLanguageLearningApp
repository: https://github.com/CodingWithTashi/TibetanLanguageLearningApp

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Firebase
  firebase_core: ^2.31.0
  firebase_auth: ^4.19.5
  firebase_analytics: ^10.10.5
  firebase_crashlytics: ^3.5.5
  google_sign_in: ^6.2.1

  # RevenueCat
  purchases_flutter: ^6.29.1

  # UI & Utilities
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  flutter_markdown: ^0.6.20+1
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.0
  smooth_page_indicator: ^1.1.0

  # Storage
  shared_preferences: ^2.2.3

  # Utils
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Code Generation
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0

  # Testing
  mockito: ^5.4.4
  mocktail: ^1.0.3
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
