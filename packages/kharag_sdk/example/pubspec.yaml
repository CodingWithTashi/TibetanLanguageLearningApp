name: kharag_sdk_example
description: Example app demonstrating kharag_sdk features
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # SDK
  kharag_sdk:
    path: ../

  # State Management
  flutter_riverpod: ^2.5.1

  # Firebase
  firebase_core: ^2.31.0

  # UI
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
